AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lab 5: Agenda Parser Lambda Function (Bedrock LLM integration) with public
  Lambda Function URL protected by Cognito JWT verification.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for resource names in this stack.

  ImageUri:
    Type: String
    Description: ECR Docker image URI containing the agenda parser Lambda handler.

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID whose tokens are accepted by the parser Lambda.

  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito User Pool App Client ID.

  ParserModel:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-6"
    Description: Amazon Bedrock model or inference profile ID for agenda parsing.

  CorsOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Comma-separated list of origins allowed to call the Function URL.

Resources:
  # -------------------------------------------------------------------------
  # IAM Execution Role for Agenda Parser Lambda
  # -------------------------------------------------------------------------
  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInferenceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # CloudWatch Log Group for Agenda Parser Lambda
  # -------------------------------------------------------------------------
  AgendaParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Agenda Parser Lambda Function (No VPC config — direct HTTPS to Bedrock/Cognito)
  # -------------------------------------------------------------------------
  AgendaParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgendaParserLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: "Lab 5: Parses meeting notes/emails into structured agenda via Amazon Bedrock"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Role: !GetAtt AgendaParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          USER_POOL_ID: !Ref CognitoUserPoolId
          USER_POOL_CLIENT_ID: !Ref CognitoClientId
          PARSER_MODEL: !Ref ParserModel
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Lambda Function URL (AuthType NONE — handler verifies Cognito JWT)
  # -------------------------------------------------------------------------
  AgendaParserFunctionUrlConfig:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods:
          - POST
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 86400

  # -------------------------------------------------------------------------
  # Public Permissions for Lambda Function URL
  # -------------------------------------------------------------------------
  AgendaParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AgendaParserFunctionUrl:
    Description: HTTPS Function URL for the Agenda Parser Lambda
    Value: !GetAtt AgendaParserFunctionUrlConfig.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-AgendaParserFunctionUrl"

  AgendaParserFunctionName:
    Description: Name of the Agenda Parser Lambda Function
    Value: !Ref AgendaParserFunction
    Export:
      Name: !Sub "${AWS::StackName}-AgendaParserFunctionName"

  AgendaParserFunctionArn:
    Description: ARN of the Agenda Parser Lambda Function
    Value: !GetAtt AgendaParserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgendaParserFunctionArn"
