AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lab 4: S3 bucket, S3 VPC Gateway Endpoint, SQS queue, Report Builder Lambda Function,
  EventBridge Schedule, S3 Notification, and Report Mailer Lambda Function.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for resource names in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Target VPC ID where the backend operates.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: List of route table IDs to associate with the S3 Gateway endpoint.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for launching Lambda tasks in the VPC.

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security Group IDs for the Lambda function.

  ImageUri:
    Type: String
    Description: ECR Docker image URI containing the report builder Lambda handler.

  DatabaseUrl:
    Type: String
    Default: "sqlite:////tmp/meetings.db"
    Description: Database connection string for fetching meeting data.

  DomainName:
    Type: String
    Default: "spry.org.ua"
    Description: Project domain name for SES Email Identity and DKIM setup.

  SenderEmail:
    Type: String
    Default: "reports@spry.org.ua"
    Description: Sender email address for weekly reports via Amazon SES.

  RecipientEmail:
    Type: String
    Default: "pasiura.pn@ucu.edu.ua"
    Description: Recipient email address for weekly reports via Amazon SES.

Resources:
  # -------------------------------------------------------------------------
  # S3 Storage for Reports (with S3 Event Notification to Mailer Lambda)
  # -------------------------------------------------------------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ReportMailerPermission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # S3 VPC Gateway Endpoint
  # -------------------------------------------------------------------------
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # -------------------------------------------------------------------------
  # SQS Queues for Asynchronous Report Requests
  # -------------------------------------------------------------------------
  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # 6x Lambda timeout (60s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Report Builder Lambda Execution IAM Role
  # -------------------------------------------------------------------------
  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-builder-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3ReportsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ReportsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${ReportsBucket.Arn}/*"
        - PolicyName: SQSReportRequestsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # CloudWatch Log Group for Report Builder Lambda
  # -------------------------------------------------------------------------
  ReportBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Report Builder Lambda Function
  # -------------------------------------------------------------------------
  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - S3Endpoint
      - ReportBuilderLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: "Lab 4: Generates weekly meeting CSV reports and uploads to S3"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Role: !GetAtt ReportBuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          REPORTS_BUCKET_NAME: !Ref ReportsBucket
          DATABASE_URL: !Ref DatabaseUrl
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Lambda Event Source Mapping (SQS -> Report Builder Lambda)
  # -------------------------------------------------------------------------
  ReportRequestsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt ReportBuilderFunction.Arn
      BatchSize: 1
      Enabled: true

  # -------------------------------------------------------------------------
  # EventBridge Scheduler Execution Role
  # -------------------------------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendMessageReportRequestsQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # EventBridge Weekly Report Schedule (SQS Target)
  # -------------------------------------------------------------------------
  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      Description: "Triggers weekly meeting report generator via SQS every Monday at 07:00 Kyiv time"
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # -------------------------------------------------------------------------
  # Report Mailer IAM Execution Role
  # -------------------------------------------------------------------------
  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-mailer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerS3AndSESAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sesv2:SendEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # CloudWatch Log Group for Report Mailer Lambda
  # -------------------------------------------------------------------------
  ReportMailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # Report Mailer Lambda Function (Runs OUTSIDE VPC for direct SES/S3 access)
  # -------------------------------------------------------------------------
  ReportMailerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReportMailerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: "Lab 4 Step 5 & 6: Sends weekly meeting reports via email upon S3 upload"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.reports.mailer_handler.handler
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SENDER_EMAIL: !Sub "reports@${DomainName}"
          RECIPIENT_EMAIL: !Ref RecipientEmail
          VERIFIED_SENDER_EMAIL: !Ref RecipientEmail
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # -------------------------------------------------------------------------
  # S3 Lambda Permission to Invoke Report Mailer
  # -------------------------------------------------------------------------
  ReportMailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ReportMailerFunction.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # -------------------------------------------------------------------------
  # SES Domain Identity & DKIM Setup (Lab 4 Step 6)
  # -------------------------------------------------------------------------
  DomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName

Outputs:
  ReportsBucketName:
    Description: S3 bucket name for weekly meeting reports
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ReportsBucketName"

  ReportsBucketArn:
    Description: ARN of the S3 reports bucket
    Value: !GetAtt ReportsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportsBucketArn"

  S3EndpointId:
    Description: ID of the S3 VPC Gateway Endpoint
    Value: !Ref S3Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-S3EndpointId"

  ReportRequestsQueueUrl:
    Description: URL of the SQS Queue for report requests
    Value: !Ref ReportRequestsQueue
    Export:
      Name: !Sub "${AWS::StackName}-ReportRequestsQueueUrl"

  ReportRequestsQueueArn:
    Description: ARN of the SQS Queue for report requests
    Value: !GetAtt ReportRequestsQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportRequestsQueueArn"

  ReportRequestsDLQUrl:
    Description: URL of the SQS Dead Letter Queue for failed report requests
    Value: !Ref ReportRequestsDLQ
    Export:
      Name: !Sub "${AWS::StackName}-ReportRequestsDLQUrl"

  ReportRequestsDLQArn:
    Description: ARN of the SQS Dead Letter Queue for failed report requests
    Value: !GetAtt ReportRequestsDLQ.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportRequestsDLQArn"

  ReportBuilderFunctionName:
    Description: Name of the report builder Lambda function
    Value: !Ref ReportBuilderFunction
    Export:
      Name: !Sub "${AWS::StackName}-ReportBuilderFunctionName"

  ReportBuilderFunctionArn:
    Description: ARN of the report builder Lambda function
    Value: !GetAtt ReportBuilderFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportBuilderFunctionArn"

  WeeklyReportScheduleArn:
    Description: ARN of the EventBridge weekly report schedule
    Value: !GetAtt WeeklyReportSchedule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WeeklyReportScheduleArn"

  ReportMailerFunctionName:
    Description: Name of the report mailer Lambda function
    Value: !Ref ReportMailerFunction
    Export:
      Name: !Sub "${AWS::StackName}-ReportMailerFunctionName"

  ReportMailerFunctionArn:
    Description: ARN of the report mailer Lambda function
    Value: !GetAtt ReportMailerFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReportMailerFunctionArn"

  DomainIdentityName:
    Description: SES Domain Email Identity
    Value: !Ref DomainIdentity
    Export:
      Name: !Sub "${AWS::StackName}-DomainIdentityName"

  DkimTokens:
    Description: Easy DKIM DNS Tokens for domain verification
    Value: !Sub "${DomainIdentity.DkimDNSTokenName1}, ${DomainIdentity.DkimDNSTokenName2}, ${DomainIdentity.DkimDNSTokenName3}"
    Export:
      Name: !Sub "${AWS::StackName}-DkimTokens"

  DkimDNSTokenName1:
    Description: DKIM DNS Record Name 1
    Value: !GetAtt DomainIdentity.DkimDNSTokenName1
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenName1"

  DkimDNSTokenValue1:
    Description: DKIM DNS Record Value 1
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue1
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenValue1"

  DkimDNSTokenName2:
    Description: DKIM DNS Record Name 2
    Value: !GetAtt DomainIdentity.DkimDNSTokenName2
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenName2"

  DkimDNSTokenValue2:
    Description: DKIM DNS Record Value 2
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue2
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenValue2"

  DkimDNSTokenName3:
    Description: DKIM DNS Record Name 3
    Value: !GetAtt DomainIdentity.DkimDNSTokenName3
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenName3"

  DkimDNSTokenValue3:
    Description: DKIM DNS Record Value 3
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue3
    Export:
      Name: !Sub "${AWS::StackName}-DkimDNSTokenValue3"

