AWSTemplateFormatVersion: "2010-09-09"
Description: Container repositories for backend and frontend images.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for repository names.

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent images to conserve Free Tier storage",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-frontend"
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent images to conserve Free Tier storage",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  BackendRepositoryUri:
    Description: URI of the backend ECR repository
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Description: URI of the frontend ECR repository
    Value: !GetAtt FrontendRepository.RepositoryUri
  BackendRepositoryName:
    Description: Name of the backend ECR repository
    Value: !Ref BackendRepository
  FrontendRepositoryName:
    Description: Name of the frontend ECR repository
    Value: !Ref FrontendRepository
