AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate Task Definition (0.25 vCPU / 0.5 GB RAM) and Service for backend.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for resource names.

  ClusterName:
    Type: String
    Description: Name of the ECS cluster.

  ImageUri:
    Type: String
    Description: URI of the backend image in ECR.

  TargetGroupArn:
    Type: String
    Description: Target group ARN to register Fargate tasks with.

  EcsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for ECS Fargate tasks.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for launching Fargate tasks.

  ExecutionRoleArn:
    Type: String
    Description: IAM role for ECS task execution.

  TaskRoleArn:
    Type: String
    Description: IAM role for ECS task.

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Allowed origins for backend CORS.

  DatabaseUrl:
    Type: String
    Default: "sqlite:////app/meetings.db"
    Description: Database connection string.

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities:
        - FARGATE
      # Free Tier limits: 0.25 vCPU (256) and 0.5 GB RAM (512)
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Ref CorsOrigins
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ProjectName}-backend"
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: backend
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-backend-service"
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref EcsSecurityGroupId
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroupArn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ServiceName:
    Description: ECS Service Name
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
